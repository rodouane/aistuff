name: Fabriquer l'APK de Hex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Télécharger le SDK Glyph de Nothing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo=Nothing-Developer-Programme/Glyph-Developer-Kit
          path=$(gh api "repos/$repo/git/trees/main?recursive=1" --jq '.tree[] | select(.path | endswith(".aar")) | .path' | head -n 1)
          if [ -n "$path" ]; then
            enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$path")
            curl -fsSL "https://raw.githubusercontent.com/$repo/main/$enc" -o app/libs/glyph-sdk.aar
            echo "SDK Glyph : $path"
          else
            echo "::warning::SDK Glyph introuvable, Hex sera compilé sans les Glyph"
          fi

      - name: Compiler
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer le pack d'installation
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hex.apk
          mkdir -p hex-installation
          cp hex.apk tools/install.sh tools/install.bat tools/hex-config.exemple.txt hex-installation/
          cp tools/hex-config.exemple.txt hex-installation/hex-config.txt
          chmod +x hex-installation/install.sh
          zip -r hex-installation.zip hex-installation

      - uses: actions/upload-artifact@v4
        with:
          name: hex-apk
          path: |
            hex.apk
            hex-installation.zip

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version hex.apk hex-installation.zip \
            --title "Hex · dernière version" \
            --notes "APK construit automatiquement depuis le commit ${GITHUB_SHA::7}." \
            --latest
